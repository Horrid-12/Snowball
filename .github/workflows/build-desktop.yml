# ============================================================================
# Snowball — Multi-Platform Desktop Build (Tauri)
#
# Builds Tauri desktop bundles for Windows, macOS, and Linux.
# Triggered on push of version tags (e.g. v8.0.1) or manually via workflow_dispatch.
#
# Produces:
#   Windows:  NSIS installer (.exe) + MSI
#   macOS:    DMG + .app bundle (universal: x86_64 + aarch64)
#   Linux:    AppImage + .deb
#
# All artifacts + updater manifest (latest.json) are uploaded to the GitHub Release.
# ============================================================================

name: Build Desktop (Tauri)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 8.0.1)'
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  RUST_TOOLCHAIN: 'stable'
  # Resolved once and reused everywhere. Cannot be inlined into a single-quoted
  # YAML scalar because the expression itself contains single quotes.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version || '8.0.1') }}

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Windows x86_64 ---
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_target: nsis
            platform_key: windows-x86_64

          # --- macOS Apple Silicon (aarch64) ---
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundle_target: dmg
            platform_key: darwin-aarch64

          # --- macOS Intel (x86_64) ---
          # macos-13 was fully retired by GitHub on 2025-12-04 (N-1 policy).
          # macos-15-intel is the last x86_64 image Actions will offer, until ~Aug 2027.
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundle_target: dmg
            platform_key: darwin-x86_64

          # --- Linux x86_64 ---
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_target: appimage
            platform_key: linux-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      # --- Linux system dependencies ---
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Install directly in frontend/ rather than via the root `npm run install:all`.
      # The root package.json has a `postinstall` hook, and driving it from CI made
      # npm recurse while two installs fought over frontend/node_modules (EPERM).
      # A desktop bundle only needs frontend deps -- the backend is deployed to Vercel.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # --- Tauri signing key ---
      - name: Setup Tauri signing
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: echo "Tauri signing key configured"

      # --- Build Tauri ---
      - name: Build Tauri (${{ matrix.platform_key }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          args: --target ${{ matrix.target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Snowball ${{ env.RELEASE_TAG }}
          releaseBody: Desktop release for ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # --- Merge updater manifests from all platforms into a single latest.json ---
  merge-updater:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          echo "Downloading updater JSONs for tag: $TAG"

          # Wait for draft release to be available
          sleep 10

          # Get the release ID
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq '.id' 2>/dev/null || echo "")

          if [[ -z "$RELEASE_ID" ]]; then
            echo "Release not found for tag $TAG. The tauri-action may have created it as draft."
            # Try to find draft releases
            RELEASE_ID=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -1 || echo "")
          fi

          if [[ -z "$RELEASE_ID" ]]; then
            echo "::warning::Could not find release for tag $TAG. Skipping updater merge."
            exit 0
          fi

          echo "Found release ID: $RELEASE_ID"

          # Download all latest.json files from the release
          mkdir -p updater-parts
          gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" --jq '.[].name' | while read -r name; do
            if [[ "$name" == *"latest.json"* ]]; then
              echo "Downloading: $name"
              gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
                --jq ".[] | select(.name == \"$name\") | .url" | while read -r url; do
                curl -sL -H "Authorization: token $GITHUB_TOKEN" \
                  -H "Accept: application/octet-stream" \
                  "$url" -o "updater-parts/$name"
              done
            fi
          done

      - name: Merge updater manifests
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"

          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'updater-parts';

            if (!fs.existsSync(dir) || fs.readdirSync(dir).length === 0) {
              console.log('No updater parts found. Skipping merge.');
              process.exit(0);
            }

            const merged = {
              version: '$VERSION',
              notes: 'Snowball $VERSION desktop release',
              pub_date: new Date().toISOString(),
              platforms: {}
            };

            for (const file of fs.readdirSync(dir)) {
              try {
                const data = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
                if (data.platforms) {
                  Object.assign(merged.platforms, data.platforms);
                }
              } catch (err) {
                console.warn('Failed to parse ' + file + ':', err.message);
              }
            }

            fs.writeFileSync('latest.json', JSON.stringify(merged, null, 2));
            console.log('Merged updater manifest:');
            console.log(JSON.stringify(merged, null, 2));
          "

      - name: Upload merged latest.json to release
        if: hashFiles('latest.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -1 || echo "")

          if [[ -n "$RELEASE_ID" ]]; then
            # Delete existing latest.json if present
            EXISTING=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              --jq '.[] | select(.name == "latest.json") | .id' 2>/dev/null || echo "")
            if [[ -n "$EXISTING" ]]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$EXISTING"
            fi

            # Upload merged file
            gh release upload "$TAG" latest.json --clobber
            echo "Uploaded merged latest.json to release $TAG"
          fi
